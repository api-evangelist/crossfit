name: Crossfit
description: >-
  CrossFit is a fitness brand and training methodology built around constantly
  varied, high-intensity functional movements that combine strength,
  conditioning, gymnastics, and weightlifting. The organization operates a
  global network of independently owned affiliate gyms, delivers a coaching
  certification and education program (the Level 1 through Level 4 courses and
  specialty seminars), and produces the annual CrossFit Games competition
  season. CrossFit was surfaced as a portfolio company of General Catalyst and
  added to the API Evangelist network as a lead; as of this enrichment pass the
  company publishes a consumer and affiliate web presence (gym finder, courses,
  store, Games results) but no public developer portal, API documentation, or
  machine-readable API definition.
